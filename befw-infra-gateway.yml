server:
  # 게이트웨이 compose 의 포트 매핑(10001:10001)·healthcheck(localhost:10001), UMD routes 와 맞춘다
  port: 10001

jwt:
  secret: ${JWT_SECRET}   # 환경변수로 주입 (befw-server-be와 동일한 값)
  # 게이트웨이 JWT 검사를 건너뛸 경로 prefix (쉼표 구분). 해당 서비스가 직접 JWT 를 검증한다
  # - /tsh/ : d94-query (키를 Base64 디코딩해 서명 → 이 게이트웨이의 키 형식과 달라 여기서 검증 불가)
  skip-path-prefixes: /tsh/

spring:
  cloud:
    gateway:
      # Eureka 기반 자동 서비스 디스커버리
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 메인 B/E 서버
        - id: befw-server-be
          uri: lb://befw-server-be       # Eureka에서 자동 탐색
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=0

        # 인증 경로 (JWT 필터 whitelist와 맞춤)
        - id: befw-auth
          uri: lb://befw-server-be
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # D94 조회 서비스
        - id: d94-query
          uri: lb://d94-query
          predicates:
            - Path=/tsh/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true